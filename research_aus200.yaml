# ============================================================
# RESEARCH base config for AUS200Cash (tools/factory.py). Not for live trading.
# Fixed 1% risk on a large notional, real XM costs (data/aus200cash_econ.json,
# exported 2026-11-08). Results are read in R, so the index's own currency does not
# matter. Spread floor = 1.3x the median spread recorded over the last 30 days,
# scaled to the price at the time; swap converted from money/lot to points.
# ============================================================
symbol: "AUS200Cash"
magic: 999017
capital:
  allocated: 100000.0
  hard_max: 100000.0
risk:
  base_risk_pct: 1.0
  max_risk_pct: 1.0
  step_up_pct: 0.0
  step_up_after_wins: 3
  drop_to_base_on_loss: true
  daily_loss_limit: 100000.0
  close_positions_on_limit: true
  max_open_positions: 1
  max_spread_points: 1000000
  min_equity_stop: 100.0
strategy:
  name: "trend_donchian"
  timeframe: "D1"
session:
  trade_start: "00:00"
  trade_end: "23:59"
  friday_close: "23:59"
  weekends: false
backtest:
  spread_points: 390
  use_bar_spread: true
  spread_ref_price: 9033.85
  commission_per_lot: 0.0
  swap_long_points: -196.0      # -1.96 per lot per night (margin currency)
  swap_short_points: 46.0
  swap_triple_weekday: 4      # Friday x3
  swap_ref_price: 9033.85
  swap_every_day: false
